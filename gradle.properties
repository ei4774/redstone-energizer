# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
org.gradle.parallel=true
org.gradle.caching=false

# NeoForge / Minecraft
# neo_version is pinned to a 21.1.x release.
neo_version=21.1.264

# Mod metadata: the jar version is "<mod_version>-<mod_loader>-<minecraft_version>",
# e.g. 1.8.3-neoforge-1.21.1
mod_version=1.8.3
mod_loader=neoforge
minecraft_version=1.21.1

# Keep Gradle from hanging on an unreachable host.
systemProp.org.gradle.internal.http.connectionTimeout=15000
systemProp.org.gradle.internal.http.socketTimeout=120000
